services:
  nextnav:
    build: .
    image: nextnav:latest
    container_name: nextnav
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      # How often link checks run. Accepts Go durations: 6h, 1d, 24h, or "off".
      CHECK_INTERVAL: ${CHECK_INTERVAL:-1d}
      # Initial admin credentials and demo data import on first startup
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      IMPORT_SAMPLE_DATA: ${IMPORT_SAMPLE_DATA:-false}
      # Favicon 防盗链 Referer 白名单；内网 IP 始终允许
      FAVICON_ALLOWED_DOMAINS: ${FAVICON_ALLOWED_DOMAINS:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"