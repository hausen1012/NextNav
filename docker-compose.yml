services:
  nextnav:
    build: .
    image: nextnav:latest
    container_name: nextnav
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      # How often link checks run. Accepts Go durations: 6h, 1d, 24h, or "off".
      CHECK_INTERVAL: ${CHECK_INTERVAL:-1d}
      # Set to 1 when served over HTTPS so the session cookie gets the Secure flag.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"